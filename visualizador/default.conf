server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve os CSV pre-comprimidos (dados/c_XXX.csv.gz) quando o app pede
    # dados/c_XXX.csv. O navegador descomprime sozinho (sem mudar o codigo).
    gzip_static always;

    # gzip on-the-fly para os assets de texto (js/css/json/plotly)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # HTML/JS/CSS sempre revalidados (atualizacoes do app aparecem na hora)
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # Dados e biblioteca podem ser cacheados (mudam pouco)
    location /dados/ {
        add_header Cache-Control "public, max-age=86400";
    }
    location /lib/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
